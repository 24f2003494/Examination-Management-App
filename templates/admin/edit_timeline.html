
{% extends "base.html" %}

{% block title %}Edit Timeline{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow-sm">

                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Edit Examination Timeline</h4>
                </div>

                <div class="card-body">

                    <div class="mb-3">
                        <label class="form-label">Timeline Type</label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ timeline.setting_name.replace('_', ' ').title() }}"
                            readonly
                        >
                    </div>

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label">
                                Start Date and Time
                            </label>

                            <input
                                type="datetime-local"
                                name="start_datetime"
                                class="form-control"
                                value="{{ timeline.start_datetime.strftime('%Y-%m-%dT%H:%M') }}"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                End Date and Time
                            </label>

                            <input
                                type="datetime-local"
                                name="end_datetime"
                                class="form-control"
                                value="{{ timeline.end_datetime.strftime('%Y-%m-%dT%H:%M') }}"
                                required
                            >
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Update Timeline
                        </button>

                        <a
                            href="{{ url_for('timeline_admin.timeline_list') }}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

{% endblock %}
