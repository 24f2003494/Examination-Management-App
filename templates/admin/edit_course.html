{% extends "base.html" %}

{% block title %}Edit Course{% endblock %}

{% block content %}
<div class="container mt-4">

    <h2 class="mb-4">Edit Course</h2>

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="POST"
                  action="{{ url_for(
                      'course_admin.edit_course',
                      course_id=course.id
                  ) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label for="course_name" class="form-label">
                        Course Name
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="course_name"
                        name="course_name"
                        value="{{ course.course_name }}"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="course_code" class="form-label">
                        Course Code
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="course_code"
                        name="course_code"
                        value="{{ course.course_code }}"
                        maxlength="20"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">
                        Description
                    </label>
                    <textarea
                        class="form-control"
                        id="description"
                        name="description"
                        rows="4"
                    >{{ course.description or "" }}</textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    Update Course
                </button>

                <a href="{{ url_for('course_admin.course_list') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>
{% endblock %}
