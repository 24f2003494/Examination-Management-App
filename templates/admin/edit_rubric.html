
{% extends "base.html" %}

{% block title %}Edit Examination Rubric{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow-sm">

                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Edit Rubric Criterion</h4>
                </div>

                <div class="card-body">

                    <p class="text-muted">
                        Examination:
                        <strong>{{ examination.exam_name }}</strong>
                    </p>

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label">
                                Criterion Name
                            </label>

                            <input
                                type="text"
                                name="criterion"
                                class="form-control"
                                maxlength="150"
                                value="{{ rubric.criterion }}"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="3"
                            >{{ rubric.description or '' }}</textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Maximum Marks
                            </label>

                            <input
                                type="number"
                                name="max_marks"
                                class="form-control"
                                min="1"
                                max="{{ examination.total_marks }}"
                                value="{{ rubric.max_marks }}"
                                required
                            >
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Update Rubric
                        </button>

                        <a
                            href="{{ url_for('rubric_admin.rubric_list', exam_id=examination.id) }}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

{% endblock %}
