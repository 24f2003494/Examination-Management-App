
{% extends "base.html" %}

{% block title %}Add Timeline{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow-sm">

                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Add Examination Timeline</h4>
                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label">
                                Timeline Type
                            </label>

                            <select
                                name="setting_name"
                                class="form-select"
                                required
                            >
                                <option value="">Select timeline type</option>

                                <option value="slot_creation">
                                    Examiner Slot Creation Period
                                </option>

                                <option value="student_booking">
                                    Student Booking Period
                                </option>
                            </select>

                            <small class="text-muted">
                                Select the activity this timeline controls.
                            </small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Start Date and Time
                            </label>

                            <input
                                type="datetime-local"
                                name="start_datetime"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                End Date and Time
                            </label>

                            <input
                                type="datetime-local"
                                name="end_datetime"
                                class="form-control"
                                required
                            >
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Timeline
                        </button>

                        <a
                            href="{{ url_for('timeline_admin.timeline_list') }}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

{% endblock %}
