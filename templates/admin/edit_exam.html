
{% extends "base.html" %}

{% block title %}Edit Examination{% endblock %}

{% block content %}
<div class="container mt-4">

    <h2 class="mb-4">Edit Examination</h2>

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="POST"
                  action="{{ url_for(
                      'exam_admin.edit_exam',
                      exam_id=examination.id
                  ) }}">

                <div class="mb-3">
                    <label for="exam_name" class="form-label">
                        Examination Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="exam_name"
                        name="exam_name"
                        value="{{ examination.exam_name }}"
                        maxlength="150"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="course_id" class="form-label">
                        Select Course
                    </label>

                    <select
                        class="form-select"
                        id="course_id"
                        name="course_id"
                        required
                    >
                        {% for course in courses %}
                        <option
                            value="{{ course.id }}"
                            {% if course.id == examination.course_id %}
                                selected
                            {% endif %}
                        >
                            {{ course.course_code }} - {{ course.course_name }}
                        </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">
                        Description
                    </label>

                    <textarea
                        class="form-control"
                        id="description"
                        name="description"
                        rows="4"
                    >{{ examination.description or "" }}</textarea>
                </div>

                <div class="mb-3">
                    <label for="total_marks" class="form-label">
                        Total Marks
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="total_marks"
                        name="total_marks"
                        min="1"
                        value="{{ examination.total_marks }}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="passing_marks" class="form-label">
                        Passing Marks
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="passing_marks"
                        name="passing_marks"
                        min="0"
                        value="{{ examination.passing_marks }}"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary">
                    Update Examination
                </button>

                <a href="{{ url_for('exam_admin.exam_list') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>
{% endblock %}
