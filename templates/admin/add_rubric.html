
{% extends "base.html" %}

{% block title %}Add Examination Rubric{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow-sm">

                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Add Rubric Criterion</h4>
                </div>

                <div class="card-body">

                    <p class="text-muted">
                        Examination: <strong>{{ examination.exam_name }}</strong>
                    </p>

                    <p>
                        Total Examination Marks:
                        <strong>{{ examination.total_marks }}</strong>
                    </p>

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label">
                                Criterion Name
                            </label>

                            <input
                                type="text"
                                name="criterion"
                                class="form-control"
                                maxlength="150"
                                placeholder="Example: Subject Knowledge"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="3"
                                placeholder="Describe how this criterion will be evaluated"
                            ></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Maximum Marks
                            </label>

                            <input
                                type="number"
                                name="max_marks"
                                class="form-control"
                                min="1"
                                max="{{ examination.total_marks }}"
                                required
                            >
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Rubric
                        </button>

                        <a
                            href="{{ url_for('rubric_admin.rubric_list', exam_id=examination.id) }}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

{% endblock %}
