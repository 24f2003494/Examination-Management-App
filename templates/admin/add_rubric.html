{% extends "base.html" %}

{% block title %}Add Examination Rubric{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow-sm">

                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Add Rubric Criterion</h4>
                </div>

                <div class="card-body">

                    <p class="text-muted">
                        Examination:
                        <strong>{{ examination.exam_name }}</strong>
                    </p>

                    <p>
                        Total Examination Marks:
                        <strong>{{ examination.total_marks }}</strong>
                    </p>

                    <form method="POST"
                          action="{{ url_for('rubric_admin.add_rubric', exam_id=examination.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label for="rubric_name" class="form-label">
                                Criterion Name
                            </label>

                            <input
                                type="text"
                                id="rubric_name"
                                name="rubric_name"
                                class="form-control"
                                minlength="2"
                                maxlength="150"
                                placeholder="Example: Subject Knowledge"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">
                                Description
                            </label>

                            <textarea
                                id="description"
                                name="description"
                                class="form-control"
                                rows="3"
                                maxlength="1000"
                                placeholder="Describe how this criterion will be evaluated"
                            ></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="max_marks" class="form-label">
                                Maximum Marks
                            </label>

                            <input
                                type="number"
                                id="max_marks"
                                name="max_marks"
                                class="form-control"
                                min="0.01"
                                max="{{ examination.total_marks }}"
                                step="0.01"
                                required
                            >
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Save Rubric
                        </button>

                        <a
                            href="{{ url_for('rubric_admin.rubric_list', exam_id=examination.id) }}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

{% endblock %}
