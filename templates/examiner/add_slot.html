{% extends "base.html" %}

{% block title %}Create Examination Slot{% endblock %}

{% block content %}
<div class="container mt-4">

    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow-sm">

                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Create Examination Slot</h4>
                </div>

                <div class="card-body">

                    {% if examinations %}

                    <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label for="examination_id" class="form-label">
                                Select Examination
                            </label>

                            <select name="examination_id"
                                    id="examination_id"
                                    class="form-select"
                                    required>

                                <option value="">Choose an examination</option>

                                {% for exam in examinations %}
                                <option value="{{ exam.id }}">
                                    {{ exam.exam_name }} - {{ exam.course.course_name }}
                                </option>
                                {% endfor %}

                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="slot_date" class="form-label">
                                Slot Date
                            </label>

                            <input type="date"
                                   name="slot_date"
                                   id="slot_date"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label for="start_time" class="form-label">
                                    Start Time
                                </label>

                                <input type="time"
                                       name="start_time"
                                       id="start_time"
                                       class="form-control"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="end_time" class="form-label">
                                    End Time
                                </label>

                                <input type="time"
                                       name="end_time"
                                       id="end_time"
                                       class="form-control"
                                       required>
                            </div>

                        </div>

                        <div class="mb-3">
                            <label for="capacity" class="form-label">
                                Maximum Student Capacity
                            </label>

                            <input type="number"
                                   name="capacity"
                                   id="capacity"
                                   class="form-control"
                                   min="1"
                                   required>
                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="{{ url_for('examiner_slots.slot_list') }}"
                               class="btn btn-secondary">
                                Cancel
                            </a>

                            <button type="submit" class="btn btn-primary">
                                Create Slot
                            </button>

                        </div>

                    </form>

                    {% else %}

                    <div class="alert alert-warning mb-0">
                        You have not been assigned any examinations yet.
                        Please contact the administrator.
                    </div>

                    {% endif %}

                </div>
            </div>

        </div>
    </div>

</div>
{% endblock %}
