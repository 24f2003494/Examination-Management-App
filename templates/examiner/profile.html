{% extends "base.html" %}

{% block title %}Examiner Profile{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">My Examiner Profile</h4>
                </div>
                <div class="card-body">
                    <p><strong>Name:</strong> {{ current_user.full_name }}</p>
                    <p><strong>Email:</strong> {{ current_user.email }}</p>

                    <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="qualification" class="form-label">Qualification</label>
                            <input type="text" id="qualification" name="qualification"
                                   class="form-control" maxlength="150"
                                   value="{{ profile.qualification or '' }}">
                        </div>

                        <div class="mb-3">
                            <label for="specialization" class="form-label">Specialization</label>
                            <input type="text" id="specialization" name="specialization"
                                   class="form-control" maxlength="150"
                                   value="{{ profile.specialization or '' }}">
                        </div>

                        <div class="mb-3">
                            <label for="experience_years" class="form-label">Experience (years)</label>
                            <input type="number" id="experience_years" name="experience_years"
                                   class="form-control" min="0" max="60"
                                   value="{{ profile.experience_years if profile.experience_years is not none else '' }}">
                        </div>

                        <button type="submit" class="btn btn-primary">Save Profile</button>
                        <a href="{{ url_for('examiner.dashboard') }}" class="btn btn-secondary">Back</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
